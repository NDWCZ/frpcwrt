# 基于 P3TERX/Actions-OpenWrt 模板裁剪
# 目标：OpenWrt 21.02.7 / ramips-mt7620 / 斐讯 K2 / 无 LuCI / 自带网页面板
name: Build OpenWrt 21.02 for Phicomm K2

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v21.02.7
  CONFIG_FILE: config/k2-mt7620.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  K2_VARIANT: v22.4
  # 新版 frp（TOML 配置）版本；二进制默认不进固件，K2 8M Flash 装不下。
  FRP_VERSION: 0.69.1
  # 如需把 frpc 打进固件（需 extroot 或更大 Flash），填 mipsle 包地址：
  # https://github.com/fatedier/frp/releases/download/v0.69.1/frp_0.69.1_linux_mipsle.tar.gz
  FRP_BIN_URL: ''
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch frpc binary (optional)
        if: env.FRP_BIN_URL != ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/files/usr/bin" /tmp/frp-bin
          curl -fsSL "$FRP_BIN_URL" -o /tmp/frp-bin/frp.tar.gz
          tar -xzf /tmp/frp-bin/frp.tar.gz -C /tmp/frp-bin
          cp /tmp/frp-bin/frp_*/frpc "$GITHUB_WORKSPACE/files/usr/bin/frpc"
          chmod 755 "$GITHUB_WORKSPACE/files/usr/bin/frpc"
          ls -lh "$GITHUB_WORKSPACE/files/usr/bin/frpc"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext git gperf help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libz-dev \
            msmtp ninja-build patch pkgconf python3 python3-pyelftools \
            python3-setuptools rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          echo "源码：$(git -C openwrt describe --tags --always)"

      - name: Run diy-part1.sh (feeds 预处理)
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---- 缓存：首次运行无命中（冷启动），第二次起生效 ----
      # dl = 源码压缩包（省重复下载）；toolchain = 交叉编译工具链（省大头，
      # 恢复命中后 make 直接跳过工具链编译，全程约缩短 1~1.5 小时）。
      # key 用滚动 run_id，每次编译结束刷新缓存；restore-keys 前缀匹配旧缓存。
      # 仓库缓存总上限 10GB，超出自动淘汰最旧的。
      - name: Cache dl (源码包)
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: mt7620-dl-${{ github.run_id }}
          restore-keys: |
            mt7620-dl-

      - name: Cache toolchain (交叉编译工具链)
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/staging_dir/host*
          key: mt7620-toolchain-${{ github.run_id }}
          restore-keys: |
            mt7620-toolchain-

      - name: Load config, panel files and run diy-part2.sh
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config
          mkdir -p openwrt/files
          cp -a "$GITHUB_WORKSPACE/files/." openwrt/files/
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Download dependencies
        run: |
          cd openwrt
          make defconfig
          echo "=== 校验目标设备（必须是 K2，不能是默认设备）==="
          grep 'CONFIG_TARGET_ramips_mt7620_DEVICE_' .config || true
          grep -q '^CONFIG_TARGET_ramips_mt7620_DEVICE_phicomm_k2=y$' .config || {
            echo "::error::设备选择错误！.config 里没有 phicomm_k2，实际选中的是："
            grep 'CONFIG_TARGET_ramips_mt7620_DEVICE_.*=y' .config || true
            echo "请检查 config/${CONFIG_FILE##*/} 第一处的设备符号是否为 CONFIG_TARGET_ramips_mt7620_DEVICE_phicomm_k2=y"
            exit 1
          }
          echo "设备校验通过：phicomm_k2"
          make download -j8
          find dl -size -1024c -exec ls -l {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) threads"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Verify firmware size
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/ramips/mt7620
          echo "=== 编译产物列表 ==="
          ls -lh
          BIN=$(ls -1 *squashfs-sysupgrade.bin 2>/dev/null | head -n1)
          test -n "$BIN" || { echo "::error::未找到 sysupgrade 固件"; exit 1; }
          echo "::notice::实际固件文件名: $BIN"
          case "$BIN" in
            *phicomm_k2*) echo "::notice::设备名校验通过：K2 固件" ;;
            *) echo "::error::产物设备名不对：$BIN 不是 K2 固件（可能又编成了默认设备）。请检查 config 中的设备符号。"; exit 1 ;;
          esac
          SIZE=$(stat -c%s "$BIN")
          echo "固件大小：$SIZE bytes / 上限 8060928 bytes (7872k)"
          test "$SIZE" -le 8060928 || { echo "::error::固件超过 K2 8M Flash 上限，请裁剪 .config"; exit 1; }

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/ramips/mt7620
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: K2-21.02-firmware
          path: ${{ env.FIRMWARE }}/*
          retention-days: 30
